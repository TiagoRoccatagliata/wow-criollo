services:
  web:
    build: .
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://wow_app:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@db:5432/wow_argentina"
      APP_URL: ${APP_URL:-https://wow-criollo.com.ar}
      RATE_LIMIT_SALT: ${RATE_LIMIT_SALT:?Configure RATE_LIMIT_SALT}
      DISCORD_INVITE_URL: ${DISCORD_INVITE_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      start_period: 60s
      interval: 30s
      timeout: 8s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wow_app
      POSTGRES_DB: wow_argentina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "wow_app", "-d", "wow_argentina"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
