services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wow_local
      POSTGRES_DB: wow_argentina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wow_local -d wow_argentina"]
      interval: 5s
      retries: 5
volumes:
  postgres_data:
